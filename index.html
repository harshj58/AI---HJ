<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: ui-sans-serif, system-ui; }
        #root { height: 100%; display: flex; flex-direction: column; }
        ::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const buildKey = () => {
            const a = "gsk_";
            const b = "0tpDPMZaSIWnJFHDlRujWGdyb3FYZQTDyjWR3kr88zKyLFz7ioNf";
            return a + b;
        };
        const SECRET_CODE = "haya@99";

        function App() {
            const [activeKey, setActiveKey] = useState('');
            const [view, setView] = useState('login');
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [activeModel, setActiveModel] = useState('llama-3.3-70b-versatile');
            const endRef = useRef(null);

            useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            const onChat = async () => {
                if(!input.trim() || loading || !activeKey) return;
                
                const userText = input.trim();
                setMessages(prev => [...prev, { role: 'user', content: userText }]);
                setInput('');
                setLoading(true);

                try {
                    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 
                            'Authorization': `Bearer ${activeKey}`,
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify({ 
                            model: activeModel, 
                            messages: [...messages, { role: 'user', content: userText }].slice(-10)
                        })
                    });

                    const data = await res.json();
                    if(data.choices) {
                        setMessages(prev => [...prev, { role: 'assistant', content: data.choices[0].message.content }]);
                    } else { throw new Error(data.error?.message || "Invalid Key"); }
                } catch(e) { 
                    setMessages(prev => [...prev, { role: 'assistant', content: `⚠️ System Error: ${e.message}` }]);
                } finally { setLoading(false); }
            };

            const handleLogin = () => {
                const val = input.trim();
                if (val === SECRET_CODE) {
                    setActiveKey(buildKey());
                    setInput('');
                    setView('chat');
                } else if (val.startsWith('gsk_')) {
                    setActiveKey(val);
                    setInput('');
                    setView('chat');
                } else {
                    alert("Unauthorized Access");
                }
            };

            const logout = () => {
                setActiveKey('');
                setMessages([]);
                setView('login');
                setShowSettings(false);
            };

            const theme = isDarkMode ? "bg-slate-950 text-white" : "bg-slate-50 text-slate-900";

            if (view === 'login') {
                return (
                    <div className={`h-full flex items-center justify-center p-6 ${theme}`}>
                        <div className={`w-full max-w-sm p-10 rounded-[3rem] border ${isDarkMode ? 'bg-slate-900 border-slate-800 shadow-2xl' : 'bg-white border-slate-200 shadow-xl'}`}>
                            <h1 className="text-3xl font-black mb-2 tracking-tighter text-center italic">UNIVERSAL AI</h1>
                            <p className="text-center text-[10px] font-bold text-blue-500 tracking-[0.3em] mb-10 opacity-60 uppercase">Cloud Processing</p>
                            
                            <div className="mb-6">
                                <a href="https://console.groq.com/keys" target="_blank" className="block w-full py-3 rounded-xl bg-blue-600/10 border border-blue-600/30 text-blue-500 font-black uppercase text-[10px] text-center tracking-widest transition-all hover:bg-blue-600/20">Get Groq API Key</a>
                            </div>

                            <input type="password" placeholder="Enter Access Key" className={`w-full p-4 rounded-2xl mb-4 text-center border outline-none font-bold ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-100 border-slate-200'}`} value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleLogin()} />
                            <button onClick={handleLogin} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl active:scale-95 transition-all uppercase tracking-widest text-xs">Initialize</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`flex flex-col h-full ${theme}`}>
                    <header className={`p-4 border-b flex justify-between items-center backdrop-blur-md z-50 ${isDarkMode ? 'bg-slate-900/50 border-slate-800' : 'bg-white/50 border-slate-200'}`}>
                        <span className="text-blue-500 font-black text-sm tracking-tighter uppercase italic">Universal AI</span>
                        <button onClick={() => setShowSettings(!showSettings)} className="p-2 bg-blue-500/10 rounded-full transition-colors hover:bg-blue-500/20">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        </button>
                    </header>

                    {showSettings && (
                        <div className={`absolute top-16 right-4 w-60 border rounded-3xl shadow-2xl p-5 z-[100] fade-in ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                            <p className="text-[10px] font-black uppercase opacity-40 mb-3 tracking-widest">Model Engine</p>
                            <div className="space-y-2 mb-4">
                                <button onClick={() => {setActiveModel('llama-3.3-70b-versatile'); setShowSettings(false)}} className={`w-full text-left p-3 rounded-xl text-xs font-bold border transition-all ${activeModel.includes('70b') ? 'border-blue-500 bg-blue-500/10 text-blue-500' : 'border-transparent opacity-60'}`}>Llama 3.3 Expert</button>
                                <button onClick={() => {setActiveModel('llama3-8b-8192'); setShowSettings(false)}} className={`w-full text-left p-3 rounded-xl text-xs font-bold border transition-all ${activeModel.includes('8b') ? 'border-blue-500 bg-blue-500/10 text-blue-500' : 'border-transparent opacity-60'}`}>Llama 3 Fast</button>
                            </div>
                            <hr className="my-4 opacity-10" />
                            <a href="https://console.groq.com/keys" target="_blank" className="block w-full text-left p-3 hover:bg-blue-500/10 rounded-xl text-xs font-bold uppercase transition-colors mb-2 text-blue-500">🛠️ Groq Console</a>
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-full text-left p-3 hover:bg-blue-500/10 rounded-xl text-xs font-bold uppercase transition-colors mb-2">🌓 Switch Theme</button>
                            <button onClick={logout} className="w-full text-left p-3 hover:bg-red-500/10 rounded-xl text-xs font-bold uppercase text-red-500 transition-colors">🔒 Terminate Session</button>
                        </div>
                    )}

                    <div className="flex-1 overflow-y-auto p-4 space-y-6 pb-32">
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-4 rounded-2xl text-sm leading-relaxed ${m.role === 'user' ? 'bg-blue-600 text-white shadow-lg' : (isDarkMode ? 'bg-slate-900 border border-slate-800 text-slate-100' : 'bg-white border border-slate-200 shadow-sm')}`}>
                                    {m.content}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-blue-500 text-[10px] font-black animate-pulse px-2 uppercase tracking-widest">Generating...</div>}
                        <div ref={endRef} />
                    </div>

                    <footer className="p-4 fixed bottom-0 w-full backdrop-blur-md">
                        <div className={`flex gap-2 max-w-3xl mx-auto p-2 rounded-[2rem] border transition-colors ${isDarkMode ? 'bg-slate-900/50 border-white/5' : 'bg-white border-slate-200 shadow-xl'}`}>
                            <input className={`flex-1 p-4 bg-transparent outline-none text-sm ${isDarkMode ? 'text-white' : 'text-slate-900'}`} placeholder="Send a message..." value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && onChat()} />
                            <button onClick={onChat} className="bg-blue-600 px-8 rounded-[1.5rem] font-black text-white active:scale-95 transition-all text-xs uppercase tracking-tighter">Send</button>
                        </div>
                    </footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
