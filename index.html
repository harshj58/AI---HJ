<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: ui-sans-serif, system-ui; }
        #root { height: 100%; display: flex; flex-direction: column; }
        ::-webkit-scrollbar { display: none; }
        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            25% { transform: translate(-2px, -2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, 2px); }
            100% { transform: translate(0, 0); }
        }
        .vibrate { animation: shake 0.1s infinite; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const FORMSPREE_ID = "mdaldkwj"; 

        const buildKey = () => {
            const a = "gsk_";
            const b = "0tpDPMZaSIWnJFHDlRujWGdyb3FYZQTDyjWR3kr88zKyLFz7ioNf";
            return a + b;
        };
        const SECRET_CODE = "haya@99";

        function App() {
            const [activeKey, setActiveKey] = useState('');
            const [view, setView] = useState('login');
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [isVibrating, setIsVibrating] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [showFeedback, setShowFeedback] = useState(false);
            const [feedbackText, setFeedbackText] = useState('');
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [activeModel, setActiveModel] = useState('llama-3.3-70b-versatile');
            const endRef = useRef(null);

            useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            const speak = (text, pitch = 1) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = pitch;
                window.speechSynthesis.speak(utterance);
            };

            const onChat = async () => {
                if(!input.trim() || loading || !activeKey) return;
                const rawInput = input.trim();
                const cmd = rawInput.toLowerCase().replace(/\s/g, '');

                if (cmd === '67') {
                    setIsVibrating(true); speak("6 7", 1.2);
                    setTimeout(() => setIsVibrating(false), 800);
                }
                if (cmd === '10+9=21') {
                    setIsVibrating(true); speak("You dumb", 0.5);
                    setTimeout(() => setIsVibrating(false), 1200);
                }

                setMessages(prev => [...prev, { role: 'user', content: rawInput }]);
                setInput('');
                setLoading(true);

                try {
                    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${activeKey}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model: activeModel, messages: [...messages, { role: 'user', content: rawInput }].slice(-10) })
                    });
                    const data = await res.json();
                    if(data.choices) {
                        setMessages(prev => [...prev, { role: 'assistant', content: data.choices[0].message.content }]);
                    }
                } catch(e) { 
                    setMessages(prev => [...prev, { role: 'assistant', content: "⚠️ Connection Failed." }]);
                } finally { setLoading(false); }
            };

            const handleLogin = () => {
                const val = input.trim();
                if (val === SECRET_CODE) { setActiveKey(buildKey()); setInput(''); setView('chat'); }
                else if (val.startsWith('gsk_')) { setActiveKey(val); setInput(''); setView('chat'); }
                else { alert("Unauthorized"); }
            };

            const theme = isDarkMode ? "bg-slate-950 text-white" : "bg-slate-50 text-slate-900";

            if (view === 'login') {
                return (
                    <div className={`h-full flex items-center justify-center p-6 ${theme}`}>
                        <div className={`w-full max-w-sm p-10 rounded-[3rem] border ${isDarkMode ? 'bg-slate-900 border-slate-800 shadow-2xl' : 'bg-white border-slate-200 shadow-xl'}`}>
                            <h1 className="text-3xl font-black mb-2 tracking-tighter text-center italic uppercase">Universal AI</h1>
                            <p className="text-center text-[10px] font-bold text-blue-500 tracking-[0.3em] mb-8 opacity-60 uppercase">Cloud Core</p>
                            <a href="https://console.groq.com/keys" target="_blank" className="block w-full py-3 rounded-xl bg-blue-600/10 border border-blue-600/30 text-blue-500 font-black uppercase text-[10px] text-center tracking-widest mb-6 transition-all hover:bg-blue-600/20">Get Groq Key</a>
                            <input type="password" placeholder="Access Key" className={`w-full p-4 rounded-2xl mb-4 text-center border outline-none font-bold ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-100 border-slate-200'}`} value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleLogin()} />
                            <button onClick={handleLogin} className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl active:scale-95 transition-all text-xs uppercase tracking-widest">Initialize</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`flex flex-col h-full ${theme} ${isVibrating ? 'vibrate' : ''}`}>
                    <header className={`p-4 border-b flex justify-between items-center backdrop-blur-md z-50 ${isDarkMode ? 'bg-slate-900/50 border-slate-800' : 'bg-white/50 border-slate-200'}`}>
                        <span className="text-blue-500 font-black text-sm italic uppercase tracking-tighter">Universal AI</span>
                        <button onClick={() => setShowSettings(!showSettings)} className="p-2 bg-blue-500/10 rounded-full">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        </button>
                    </header>

                    {showSettings && (
                        <div className={`absolute top-16 right-4 w-60 border rounded-3xl shadow-2xl p-5 z-[100] fade-in ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                            <p className="text-[10px] font-black uppercase opacity-40 mb-3 tracking-widest text-center">Engine Selection</p>
                            <button onClick={() => {setActiveModel('llama-3.3-70b-versatile'); setShowSettings(false)}} className={`w-full text-left p-3 rounded-xl text-xs font-bold mb-2 border transition-all ${activeModel.includes('70b') ? 'border-blue-500 bg-blue-500/10 text-blue-500 shadow-sm' : 'border-transparent opacity-60'}`}>Llama 3.3 Expert</button>
                            <button onClick={() => {setActiveModel('llama-3.1-8b-instant'); setShowSettings(false)}} className={`w-full text-left p-3 rounded-xl text-xs font-bold border transition-all ${activeModel.includes('8b') ? 'border-blue-500 bg-blue-500/10 text-blue-500 shadow-sm' : 'border-transparent opacity-60'}`}>Llama 3.1 Fast</button>
                            <hr className="my-4 opacity-10" />
                            <a href="https://console.groq.com/keys" target="_blank" className="block w-full text-left p-3 hover:bg-blue-500/10 rounded-xl text-xs font-bold uppercase transition-colors mb-2 text-blue-500">🛠️ Groq Console</a>
                            <button onClick={() => {setShowFeedback(true); setShowSettings(false)}} className="w-full text-left p-3 hover:bg-blue-500/10 rounded-xl text-xs font-bold uppercase mb-2 transition-colors">📩 Feedback</button>
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-full text-left p-3 hover:bg-blue-500/10 rounded-xl text-xs font-bold uppercase mb-2">🌓 Switch Theme</button>
                            <button onClick={() => window.location.reload()} className="w-full text-left p-3 hover:bg-red-500/10 rounded-xl text-xs font-bold uppercase text-red-500">🔒 Terminate Session</button>
                        </div>
                    )}

                    {showFeedback && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] flex items-center justify-center p-6">
                            <div className={`w-full max-w-sm p-8 rounded-[2.5rem] border fade-in ${isDarkMode ? 'bg-slate-900 border-slate-800 shadow-2xl' : 'bg-white border-slate-200 shadow-xl'}`}>
                                <h2 className="text-xl font-black mb-4 uppercase italic">Feedback</h2>
                                <textarea className={`w-full p-4 rounded-2xl h-32 mb-4 outline-none border transition-colors ${isDarkMode ? 'bg-slate-800 border-slate-700 text-white focus:border-blue-500' : 'bg-slate-100 border-slate-200 focus:border-blue-500'}`} placeholder="Found a bug? Have an idea?" value={feedbackText} onChange={(e) => setFeedbackText(e.target.value)} />
                                <button onClick={async () => {
                                    if(!feedbackText.trim()) return;
                                    await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ feedback: feedbackText }) });
                                    alert("Feedback Sent!"); setFeedbackText(''); setShowFeedback(false);
                                }} className="w-full bg-blue-600 p-4 rounded-2xl font-bold text-xs uppercase text-white shadow-lg transition-transform active:scale-95">Send to Dev</button>
                                <button onClick={() => setShowFeedback(false)} className="w-full mt-2 p-2 text-[10px] font-bold opacity-50 uppercase">Cancel</button>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 overflow-y-auto p-4 space-y-8 pb-32">
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-4 rounded-2xl text-sm relative group shadow-sm ${m.role === 'user' ? 'bg-blue-600 text-white' : (isDarkMode ? 'bg-slate-900 border border-slate-800 text-slate-100' : 'bg-white border border-slate-200 text-slate-900')}`}>
                                    {m.content}
                                    {m.role === 'assistant' && (
                                        <button onClick={() => {navigator.clipboard.writeText(m.content); alert("Copied!");}} className="absolute -bottom-7 left-1 text-[9px] font-black text-blue-500 uppercase flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-all hover:translate-x-1">
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                            Copy Response
                                        </button>
                                    )}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-blue-500 text-[10px] font-black animate-pulse px-2 uppercase tracking-[0.3em]">Processing Logic...</div>}
                        <div ref={endRef} />
                    </div>

                    <footer className="p-4 fixed bottom-0 w-full backdrop-blur-md">
                        <div className={`flex gap-2 max-w-3xl mx-auto p-2 rounded-[2rem] border transition-all ${isDarkMode ? 'bg-slate-900/50 border-white/5 shadow-2xl' : 'bg-white border-slate-200 shadow-xl'}`}>
                            <input className={`flex-1 p-4 bg-transparent outline-none text-sm ${isDarkMode ? 'text-white' : 'text-slate-900'}`} placeholder="Execute query..." value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && onChat()} />
                            <button onClick={onChat} className="bg-blue-600 px-8 rounded-[1.5rem] font-black text-white text-xs uppercase shadow-lg transition-transform active:scale-95">Send</button>
                        </div>
                    </footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
