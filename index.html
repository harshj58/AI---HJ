<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { transition: background 0.4s; overflow-x: hidden; font-family: ui-sans-serif, system-ui; }
        .dark { background: #02040a; color: white; }
        .light { background: #f0f2f5; color: #1a1a1a; }
        
        /* Device-Specific Styling */
        .auth-card { background: #0d1117; border-radius: 2rem; border: 2px solid #2563eb; width: 90%; max-width: 400px; }
        
        .glass { 
            backdrop-filter: blur(20px); 
            background: rgba(13, 17, 23, 0.85); 
            border: 2px solid rgba(59, 130, 246, 0.6); 
            border-radius: 1.5rem; 
        }
        .light .glass { 
            background: rgba(255, 255, 255, 0.9); 
            border: 2px solid rgba(0, 0, 0, 0.5); 
        }

        /* Mobile Adjustments */
        @media (max-width: 640px) {
            .chat-text { font-size: 0.85rem; }
            .header-title { font-size: 1rem; }
            .input-box { padding: 0.75rem; }
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes shake { 0%, 100% {transform: translate(0,0);} 25% {transform: translate(1px,1px);} 75% {transform: translate(-1px,-1px);} }
        .vibrate { animation: shake 0.1s infinite; }
    </style>
</head>
<body class="dark">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [view, setView] = useState('auth');
            const [isDark, setIsDark] = useState(true);
            const [model, setModel] = useState('fast'); 
            const [key, setKey] = useState('');
            const [input, setInput] = useState('');
            const [msgs, setMsgs] = useState([]);
            const [loading, setLoading] = useState(false);
            const [vib, setVib] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => { document.body.className = isDark ? 'dark' : 'light'; }, [isDark]);
            useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [msgs]);

            // ULTRA-HIDE KEY: Stored as decimal character codes
            const handleAuth = (val) => {
                if (val === 'haya@99') {
                    // This is your key transformed into character codes
                    const _vault = [103,115,107,95,98,51,99,78,122,106,66,88,77,120,117,71,74,101,80,73,88,102,73,121,87,71,100,121,98,51,70,89,87,88,113,80,89,54,98,119,104,55,110,111,50,56,55,84,54,86,85,85,122,80,110,112];
                    const _unlocked = String.fromCharCode(..._vault);
                    setKey(_unlocked);
                    setView('chat');
                } else if (val.startsWith('gsk_')) {
                    setKey(val);
                    setView('chat');
                } else {
                    alert("System Lock: Access Denied");
                }
            };

            const callAI = async () => {
                if(!input.trim() || loading) return;
                const m = input; setInput('');
                if(m === '67') { setVib(true); window.speechSynthesis.speak(new SpeechSynthesisUtterance("6 7")); setTimeout(()=>setVib(false), 800); }

                setMsgs(p => [...p, {role: 'user', content: m}]);
                setLoading(true);

                try {
                    const modelId = model === 'fast' ? "llama3-8b-8192" : "llama-3.3-70b-versatile";
                    
                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        mode: 'cors', // Explicitly enable CORS
                        headers: { 
                            'Authorization': `Bearer ${key.trim()}`, 
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify({ 
                            model: modelId, 
                            messages: [
                                {role: "system", content: "You are Universal AI. Clean plain text only. No markdown. No asterisks."},
                                ...msgs.slice(-4),
                                {role: 'user', content: m}
                            ],
                            temperature: 0.7
                        })
                    });

                    if (!response.ok) throw new Error();

                    const data = await response.json();
                    let reply = data.choices[0].message.content.replace(/\*/g, '');
                    setMsgs(p => [...p, {role: 'assistant', content: reply}]);
                } catch (e) {
                    setMsgs(p => [...p, {role: 'assistant', content: "Sync failed. Browser blocked the request or key invalid."}]);
                }
                setLoading(false);
            };

            if (view === 'auth') return (
                <div className="h-screen flex items-center justify-center p-4 bg-[#02040a]">
                    <div className="auth-card p-8 md:p-12 text-center">
                        <h1 className="text-2xl md:text-3xl font-black text-white mb-2 uppercase italic tracking-tighter">Universal AI</h1>
                        <p className="text-[10px] font-bold text-blue-500 tracking-[0.3em] mb-8 opacity-70 uppercase">Secure Logic v5</p>
                        
                        <a href="https://console.groq.com/keys" target="_blank" className="block w-full py-3 mb-4 rounded-xl bg-gray-900 text-blue-400 text-[10px] font-black uppercase tracking-widest border border-white/5">
                            Request Groq Key
                        </a>
                        
                        <input 
                            type="text" 
                            placeholder="CODE OR KEY" 
                            className="w-full p-4 bg-gray-900 rounded-xl mb-4 text-center text-white text-xs border border-white/10 outline-none focus:border-blue-500"
                            onKeyPress={e => e.key === 'Enter' && handleAuth(e.target.value)}
                        />
                        
                        <button onClick={() => handleAuth(document.querySelector('input').value)} className="w-full bg-blue-600 text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all">
                            Initialize
                        </button>
                    </div>
                </div>
            );

            return (
                <div className={`h-screen flex flex-col p-2 md:p-4 ${vib ? 'vibrate' : ''}`}>
                    <header className="glass p-3 md:p-4 mb-2 flex justify-between items-center shadow-xl">
                        <div>
                            <h1 className="header-title text-sm font-black uppercase tracking-widest text-blue-500">Universal AI</h1>
                            <div className="flex gap-3 mt-1">
                                <button onClick={()=>setModel('fast')} className={`text-[9px] font-black uppercase tracking-widest ${model==='fast'?'text-white':'text-gray-500'}`}>Fast</button>
                                <button onClick={()=>setModel('expert')} className={`text-[9px] font-black uppercase tracking-widest ${model==='expert'?'text-white':'text-gray-500'}`}>Expert</button>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={()=>setIsDark(!isDark)} className="w-9 h-9 md:w-10 md:h-10 rounded-xl glass flex items-center justify-center border-none">{isDark?'☀️':'🌙'}</button>
                            <button onClick={()=>setView('auth')} className="px-3 h-9 md:h-10 rounded-xl glass flex items-center justify-center text-[9px] font-black text-red-500 border-none">Exit</button>
                        </div>
                    </header>

                    <div className="flex-1 glass overflow-hidden flex flex-col shadow-2xl">
                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 scrollbar-hide">
                            {msgs.map((m, i) => (
                                <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`p-4 rounded-2xl max-w-[90%] md:max-w-[80%] chat-text leading-relaxed ${
                                        m.role === 'user' ? 'bg-blue-600 text-white' : (isDark ? 'bg-gray-800' : 'bg-white shadow-md text-gray-900')
                                    }`}>
                                        {m.content}
                                    </div>
                                </div>
                            ))}
                            {loading && <div className="text-blue-500 font-black text-[9px] animate-pulse uppercase px-2">Processing...</div>}
                        </div>

                        <div className="p-3 md:p-4 border-t border-blue-500/30 flex gap-2">
                            <input 
                                className="flex-1 p-3 md:p-4 bg-transparent outline-none text-sm placeholder:opacity-30"
                                placeholder="Consulting..."
                                value={input}
                                onChange={e => setInput(e.target.value)}
                                onKeyPress={e => e.key === 'Enter' && callAI()}
                            />
                            <button onClick={callAI} className="bg-blue-600 text-white px-5 md:px-8 rounded-xl font-black text-[10px] uppercase active:scale-95 transition-all">Send</button>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
