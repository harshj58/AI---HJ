<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI | Haya Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background: #010409; color: white; font-family: ui-sans-serif, system-ui; overflow: hidden; }
        .glass { background: rgba(13, 17, 23, 0.95); border: 1px solid #30363d; border-radius: 1.5rem; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes shake { 0% {transform: translate(1px,1px);} 50% {transform: translate(-1px,-1px);} 100% {transform: translate(0,0);} }
        .vibrate { animation: shake 0.1s infinite; }
        .ai-message { border-bottom-left-radius: 2px; }
        .user-message { border-bottom-right-radius: 2px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [isLocked, setIsLocked] = useState(true);
            const [key, setKey] = useState('');
            const [input, setInput] = useState('');
            const [msgs, setMsgs] = useState([{ role: 'assistant', content: 'SYSTEM STANDBY. PROVIDE ACCESS CODE.' }]);
            const [vib, setVib] = useState(false);
            const [loading, setLoading] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [msgs]);

            const handleAction = async () => {
                const val = input.trim();
                if (!val) return;

                // 1. OBFUSCATED LOGIN (Hides Key in Code)
                if (isLocked && val === 'haya@99') {
                    // This is your Base64 encoded Groq Key
                    const _0x4a2 = "Z3NrX1NBdDh6eXZoQUl5eEZIdmVYNmFIV0dyeWIzRllDRnNPWVNGR0NWN0o3TTdDbTNlWTB3Sk0=";
                    setKey(window.atob(_0x4a2));
                    setIsLocked(false);
                    setMsgs([{ role: 'assistant', content: 'Universal AI Unlocked. Greetings, Haya.' }]);
                    setInput('');
                    return;
                }

                if (isLocked) {
                    setMsgs([...msgs, { role: 'user', content: val }, { role: 'assistant', content: 'ACCESS DENIED.' }]);
                    setInput('');
                    return;
                }

                const userMsg = val;
                setInput('');

                // 2. SECRET TRIGGERS
                if (userMsg === '67') {
                    setVib(true);
                    const m = new SpeechSynthesisUtterance("6 7");
                    window.speechSynthesis.speak(m);
                    setTimeout(() => setVib(false), 800);
                }
                if (userMsg === '10+9=21') {
                    setVib(true);
                    const m = new SpeechSynthesisUtterance("You dumb");
                    m.pitch = 0.5;
                    window.speechSynthesis.speak(m);
                    setTimeout(() => setVib(false), 1000);
                }

                setMsgs(prev => [...prev, { role: 'user', content: userMsg }]);
                setLoading(true);

                // 3. SECURE API CALL WITH NO-MARKDOWN PROTOCOL
                try {
                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${key}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            messages: [
                                {
                                    role: "system",
                                    content: "You are Haya's Universal AI. Respond in clean, plain text. NEVER use asterisks (*), bolding (**), or markdown. No roleplay actions. Just raw, sharp text."
                                },
                                ...msgs.slice(-5),
                                { role: 'user', content: userMsg }
                            ]
                        })
                    });

                    const data = await response.json();
                    let reply = data.choices[0].message.content;

                    // 4. ASTERISK STRIPPER (Redundant Protection)
                    reply = reply.replace(/\*/g, '');

                    setMsgs(prev => [...prev, { role: 'assistant', content: reply }]);
                } catch (e) {
                    setMsgs(prev => [...prev, { role: 'assistant', content: "CORE SYNC ERROR. CHECK KEY STATUS." }]);
                }
                setLoading(false);
            };

            return (
                <div className={`h-screen flex flex-col p-4 bg-[#010409] ${vib ? 'vibrate' : ''}`}>
                    {/* Header */}
                    <div className="glass p-5 mb-4 flex justify-between items-center border-[#30363d]">
                        <div className="flex flex-col">
                            <h1 className="text-xl font-black italic tracking-tighter text-blue-500">UNIVERSAL AI</h1>
                            <span className="text-[8px] font-bold tracking-[0.3em] opacity-50 uppercase">Secure Logic v4.0</span>
                        </div>
                        <div className={`flex items-center gap-2 px-3 py-1 rounded-full border ${isLocked ? 'border-red-500/50' : 'border-emerald-500/50'}`}>
                            <div className={`h-2 w-2 rounded-full ${isLocked ? 'bg-red-500' : 'bg-emerald-500 animate-pulse'}`}></div>
                            <span className="text-[9px] font-black uppercase tracking-widest">{isLocked ? 'Locked' : 'Online'}</span>
                        </div>
                    </div>

                    {/* Chat Window */}
                    <div className="flex-1 glass overflow-hidden flex flex-col mb-4 border-[#30363d]">
                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-5 space-y-6 text-sm scrollbar-hide">
                            {msgs.map((m, i) => (
                                <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`p-4 rounded-2xl max-w-[85%] shadow-xl leading-relaxed ${
                                        m.role === 'user' 
                                        ? 'bg-blue-600 text-white font-semibold user-message' 
                                        : 'bg-[#161b22] border border-[#30363d] text-gray-200 ai-message'
                                    }`}>
                                        {m.content}
                                    </div>
                                </div>
                            ))}
                            {loading && (
                                <div className="flex justify-start">
                                    <div className="bg-[#161b22] p-3 rounded-xl border border-[#30363d] text-blue-500 text-[10px] font-black tracking-widest animate-pulse uppercase">
                                        Analyzing...
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Control Deck */}
                        <div className="p-4 border-t border-[#30363d] bg-[#0d1117]/50 flex gap-2">
                            <input
                                className="flex-1 p-4 bg-[#010409] rounded-xl border border-[#30363d] outline-none focus:border-blue-500 text-white transition-all placeholder:text-gray-600 font-medium"
                                placeholder={isLocked ? "ACCESS CODE REQUIRED" : "CONSULT SYSTEM..."}
                                type={isLocked ? "password" : "text"}
                                value={input}
                                onChange={e => setInput(e.target.value)}
                                onKeyPress={e => e.key === 'Enter' && handleAction()}
                            />
                            <button
                                onClick={handleAction}
                                className={`px-8 rounded-xl font-black text-xs uppercase transition-all active:scale-95 ${
                                    isLocked ? 'bg-red-600 text-white' : 'bg-blue-600 text-white'
                                }`}
                            >
                                {isLocked ? 'Unlock' : 'Send'}
                            </button>
                        </div>
                    </div>
                    
                    <div className="flex justify-between items-center px-2 opacity-30">
                        <span className="text-[8px] font-black uppercase tracking-widest">Auth: Haya</span>
                        <span className="text-[8px] font-black uppercase tracking-widest">Universal AI Engine</span>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
