<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: ui-sans-serif, system-ui; }
        #root { height: 100%; display: flex; flex-direction: column; }
        ::-webkit-scrollbar { display: none; }
        .prose pre { background: #1e293b; padding: 1rem; border-radius: 0.75rem; overflow-x: auto; margin: 10px 0; border: 1px solid #334155; }
        .prose code { font-family: 'Courier New', monospace; color: #38bdf8; padding: 2px 4px; border-radius: 4px; }
        .meme-67 { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; pointer-events: none; }
        .hand { position: absolute; width: 45px; height: 12px; background: white; border-radius: 10px; top: 50%; border: 2px solid rgba(0,0,0,0.1); }
        .hand-left { left: -55px; transform-origin: right; animation: waveLeft 0.15s infinite alternate; }
        .hand-right { right: -55px; transform-origin: left; animation: waveRight 0.15s infinite alternate; }
        @keyframes waveLeft { from { transform: rotate(30deg); } to { transform: rotate(-50deg); } }
        @keyframes waveRight { from { transform: rotate(-30deg); } to { transform: rotate(50deg); } }
        .flash-text { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(220, 38, 38, 0.9); z-index: 1001; font-size: 5rem; font-weight: 900; color: white; animation: flash 0.1s infinite; text-transform: uppercase; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const FORMSPREE_ID = "mdaldkwj"; 
        const buildKey = () => "gsk_" + "0tpDPMZaSIWnJFHDlRujWGdyb3FYZQTDyjWR3kr88zKyLFz7ioNf";
        const SECRET_CODE = "haya@99";

        function App() {
            const [activeKey, setActiveKey] = useState('');
            const [view, setView] = useState('login');
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [showSettings, setShowSettings] = useState(false);
            const [showFeedback, setShowFeedback] = useState(false);
            const [feedbackText, setFeedbackText] = useState('');
            // Updated to Compound Model for 2026 Web Search capabilities
            const [activeModel, setActiveModel] = useState('llama-3.3-70b-versatile');
            const [show67, setShow67] = useState(false);
            const [showDumb, setShowDumb] = useState(false);
            
            const endRef = useRef(null);
            useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            const speak = (text, pitch = 1) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = pitch;
                window.speechSynthesis.speak(utterance);
            };

            const handleLogin = () => {
                const val = input.trim();
                if (val === SECRET_CODE || val.startsWith('gsk_')) {
                    setActiveKey(val === SECRET_CODE ? buildKey() : val);
                    setInput(''); setView('chat');
                } else { alert("Unauthorized Access"); }
            };

            const onChat = async () => {
                const rawInput = input.trim();
                const cmd = rawInput.toLowerCase().replace(/\s/g, '');
                if (cmd === '67') { setShow67(true); speak("sixty seven", 1.4); setTimeout(() => setShow67(false), 2000); setInput(''); return; }
                if (cmd === '10+9=21') { setShowDumb(true); speak("You dumb", 0.5); setTimeout(() => setShowDumb(false), 1500); setInput(''); return; }
                if(!rawInput || loading || !activeKey) return;

                const newMessages = [...messages, { role: 'user', content: rawInput }];
                setMessages(newMessages); setInput(''); setLoading(true);

                const currentYear = new Date().getFullYear();
                const fullDate = new Date().toDateString();

                try {
                    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${activeKey}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            model: activeModel, 
                            messages: [
                                { role: 'system', content: `You are Gemini AI. Today's date is ${fullDate}. Current year is ${currentYear}. You have access to real-time 2026 data. Answer questions accurately based on current events.` },
                                ...newMessages.slice(-10)
                            ] 
                        })
                    });
                    const data = await res.json();
                    if(data.choices) setMessages(prev => [...prev, { role: 'assistant', content: data.choices[0].message.content }]);
                } catch(e) { 
                    setMessages(prev => [...prev, { role: 'assistant', content: "⚠️ Connection Lost." }]);
                } finally { setLoading(false); }
            };

            const theme = isDarkMode ? "bg-slate-950 text-white" : "bg-slate-50 text-slate-900";

            if (view === 'login') {
                return (
                    <div className={`h-full flex flex-col items-center justify-center p-6 ${theme}`}>
                        <div className={`w-full max-w-[340px] p-10 rounded-[3rem] border transition-all ${isDarkMode ? 'bg-slate-900 border-slate-800 shadow-2xl' : 'bg-white border-slate-200 shadow-xl'}`}>
                            <h1 className="text-3xl font-black mb-2 tracking-tighter text-center italic uppercase">Universal AI</h1>
                            <p className="text-center text-[10px] font-bold text-blue-500 tracking-[0.2em] mb-8 uppercase opacity-60">Authentication Required</p>
                            <button onClick={() => window.open('https://console.groq.com/keys', '_blank')} className="block w-full py-3 rounded-xl bg-blue-600/10 border border-blue-600/30 text-blue-500 font-black uppercase text-[10px] text-center tracking-widest mb-6 hover:bg-blue-600/20 active:scale-95 transition-all">Get Groq Api Key</button>
                            <input type="password" placeholder="Access Key" className={`w-full p-4 rounded-2xl mb-4 text-center border outline-none font-bold transition-all ${isDarkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-100 border-slate-200 text-slate-900'}`} value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleLogin()} />
                            <button onClick={handleLogin} className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl active:scale-95 transition-all text-xs uppercase tracking-widest shadow-lg shadow-blue-600/20">Initialize</button>
                        </div>
                        <p className="mt-8 text-[10px] font-black uppercase tracking-[0.3em] opacity-40">POWERED BY GEMINI & GROQ</p>
                    </div>
                );
            }

            return (
                <div className={`flex flex-col h-full ${theme}`}>
                    {show67 && ( <div className="meme-67"><div className="relative text-9xl font-black italic text-blue-500 drop-shadow-2xl">67<div className="hand hand-left"></div><div className="hand hand-right"></div></div></div> )}
                    {showDumb && <div className="flash-text">U DUMB</div>}

                    {showFeedback && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-md z-[200] flex items-center justify-center p-6" onClick={() => setShowFeedback(false)}>
                            <div className={`w-full max-w-sm p-8 rounded-[2.5rem] border fade-in ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`} onClick={(e) => e.stopPropagation()}>
                                <h2 className="text-xl font-black mb-4 uppercase italic">Feedback</h2>
                                <textarea className={`w-full p-4 rounded-2xl h-32 mb-4 outline-none border transition-colors ${isDarkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-100 border-slate-200'}`} placeholder="Found a bug?" value={feedbackText} onChange={(e) => setFeedbackText(e.target.value)} />
                                <button onClick={async () => {
                                    if(!feedbackText.trim()) return;
                                    await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: feedbackText }) });
                                    alert("Sent!"); setFeedbackText(''); setShowFeedback(false);
                                }} className="w-full bg-blue-600 p-4 rounded-2xl font-bold text-xs uppercase text-white active:scale-95 transition-transform">Submit</button>
                            </div>
                        </div>
                    )}

                    <header className={`p-4 border-b flex justify-between items-center z-40 backdrop-blur-md relative ${isDarkMode ? 'bg-slate-900/50 border-slate-800' : 'bg-white/50 border-slate-200'}`}>
                        <span className="text-blue-500 font-black text-sm italic uppercase tracking-tighter">Universal AI</span>
                        <button onClick={(e) => { e.stopPropagation(); setShowSettings(!showSettings); }} className="p-2 bg-blue-500/10 rounded-full active:scale-90 transition-transform z-50">⚙️</button>
                        {showSettings && ( <div className="fixed inset-0 z-40" onClick={() => setShowSettings(false)} /> )}
                        {showSettings && (
                            <div className={`absolute top-16 right-4 w-64 border rounded-3xl shadow-2xl p-5 z-50 fade-in ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                                <button onClick={() => {setActiveModel('llama-3.3-70b-versatile'); setShowSettings(false)}} className={`w-full text-left p-3 rounded-xl text-xs font-bold mb-2 border ${activeModel.includes('70b') ? 'border-blue-500 bg-blue-500/10 text-blue-500' : 'border-transparent opacity-60'}`}>Llama 3.3 Expert</button>
                                <button onClick={() => {setActiveModel('llama-3.1-8b-instant'); setShowSettings(false)}} className={`w-full text-left p-3 rounded-xl text-xs font-bold border ${activeModel.includes('8b') ? 'border-blue-500 bg-blue-500/10 text-blue-500' : 'border-transparent opacity-60'}`}>Llama 3.1 Fast</button>
                                <hr className="my-4 opacity-10" />
                                <button onClick={() => {window.open('https://weblite2.vercel.app', '_blank'); setShowSettings(false);}} className="w-full text-left p-3 hover:bg-blue-500/10 rounded-xl text-xs font-bold uppercase mb-2">🌐 Website Library</button>
                                <button onClick={() => {setShowFeedback(true); setShowSettings(false);}} className="w-full text-left p-3 hover:bg-blue-500/10 rounded-xl text-xs font-bold uppercase mb-2">📩 Send Feedback</button>
                                <button onClick={() => {window.open('https://console.groq.com/keys', '_blank'); setShowSettings(false);}} className="w-full text-left p-3 hover:bg-blue-500/10 rounded-xl text-xs font-bold uppercase mb-2 text-blue-500">🛠️ Groq Console</button>
                                <button onClick={() => {setIsDarkMode(!isDarkMode); setShowSettings(false);}} className="w-full text-left p-3 hover:bg-blue-500/10 rounded-xl text-xs font-bold uppercase mb-2">🌓 Toggle Theme</button>
                                <button onClick={() => window.location.reload()} className="w-full text-left p-3 hover:bg-red-500/10 rounded-xl text-xs font-bold uppercase text-red-500">🔒 Exit Session</button>
                            </div>
                        )}
                    </header>

                    <div className="flex-1 overflow-y-auto p-4 space-y-8 pb-32">
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[88%] p-4 rounded-2xl text-sm shadow-sm ${m.role === 'user' ? 'bg-blue-600 text-white' : (isDarkMode ? 'bg-slate-900 border border-slate-800' : 'bg-white border border-slate-200')}`}>
                                    <div className="prose prose-invert" dangerouslySetInnerHTML={{ __html: marked.parse(m.content) }} />
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-blue-500 text-[10px] font-black animate-pulse px-2 uppercase tracking-widest">AI Searching 2026...</div>}
                        <div ref={endRef} />
                    </div>

                    <footer className="p-4 fixed bottom-0 w-full backdrop-blur-md z-30 flex flex-col items-center">
                        <div className={`flex gap-2 w-full max-w-3xl p-2 rounded-[2rem] border ${isDarkMode ? 'bg-slate-900/80 border-white/5 shadow-2xl' : 'bg-white border-slate-200 shadow-xl'}`}>
                            <input className="flex-1 p-4 bg-transparent outline-none text-sm" placeholder="Ask anything" value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && onChat()} />
                            <button onClick={onChat} className="bg-blue-600 px-8 rounded-full font-black text-white text-xs uppercase shadow-lg active:scale-95 transition-transform">Send</button>
                        </div>
                        <div className="mt-2 text-[9px] font-bold uppercase tracking-widest opacity-40 text-center leading-tight">
                            POWERED BY GEMINI & GROQ<br/>
                            Uni AI can make mistakes as it is a AI
                        </div>
                    </footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
