<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: ui-sans-serif, system-ui; }
        #root { height: 100%; display: flex; flex-direction: column; }
        
        /* MADNESS ANIMATIONS */
        @keyframes ultra-shake {
            0% { transform: translate(8px, 8px) rotate(0deg); filter: hue-rotate(0deg); }
            25% { transform: translate(-8px, -8px) rotate(-5deg); filter: hue-rotate(90deg); }
            50% { transform: translate(8px, -8px) rotate(5deg); filter: hue-rotate(180deg); }
            75% { transform: translate(-8px, 8px) rotate(-3deg); filter: hue-rotate(270deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); filter: hue-rotate(360deg); }
        }
        .madness-active { animation: ultra-shake 0.05s infinite !important; background: red !important; }
        
        /* THE WHITEOUT */
        .whiteout-overlay { position: fixed; inset: 0; background: white; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.1s ease-in; }
        .whiteout-active { opacity: 1; pointer-events: all; }

        .login-card { border-radius: 3rem; padding: 3rem; width: 100%; max-width: 420px; text-align: center; z-index: 20; }
        .bottom-watermark { position: absolute; bottom: 1.5rem; width: 100%; text-align: center; z-index: 30; pointer-events: none; }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function App() {
            const [apiKey, setApiKey] = useState('');
            const [view, setView] = useState('login');
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [activeModel, setActiveModel] = useState('llama-3.3-70b-versatile');
            
            // Madness State
            const [spamCount, setSpamCount] = useState(0);
            const [isMad, setIsMad] = useState(false);
            const [isWhiteout, setIsWhiteout] = useState(false);

            useEffect(() => {
                if (spamCount >= 5) {
                    setIsMad(true);
                    speak("System overload six seven six seven", 1.5, 2);
                    
                    // Trigger Whiteout after 2 seconds of madness
                    setTimeout(() => {
                        setIsWhiteout(true);
                        // Reset everything after the flash
                        setTimeout(() => {
                            setIsWhiteout(false);
                            setIsMad(false);
                            setSpamCount(0);
                            setMessages([]);
                        }, 1000);
                    }, 2000);
                }
            }, [spamCount]);

            const speak = (text, pitch = 1, rate = 1) => {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.pitch = pitch; msg.rate = rate; msg.volume = 1;
                window.speechSynthesis.speak(msg);
            };

            const onChat = async () => {
                if(!input.trim()) return;
                const userMsg = input.trim();
                const normalized = userMsg.replace(/\s+/g, '').toLowerCase();

                if (normalized === '67') {
                    setSpamCount(prev => prev + 1);
                    speak("6 7", 1.2, 1);
                } else if (normalized === '10+9=21') {
                    speak("You dumb", 0.5, 1);
                } else {
                    setSpamCount(0); // Reset spam if they type something else
                }

                setMessages(prev => [...prev, { role: 'user', content: userMsg }]);
                setInput('');
                // ... (Groq API logic remains same as before)
            };

            if (view === 'login') {
                return (
                    <div className={`relative h-full flex items-center justify-center p-6 ${isDarkMode ? 'bg-slate-950' : 'bg-slate-50'}`}>
                        <div className={`login-card border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-xl'}`}>
                            <h1 className="text-4xl font-black mb-1 tracking-tighter uppercase">Universal AI</h1>
                            <input type="password" placeholder="Enter API Key" className="w-full p-4 rounded-2xl mb-4 text-center bg-slate-800 text-white" value={apiKey} onChange={(e) => setApiKey(e.target.value)} />
                            <button onClick={() => {speak("", 1); setView('chat')}} className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl">START SYSTEM</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`flex flex-col h-full transition-all duration-75 ${isDarkMode ? 'bg-slate-950 text-white' : 'bg-slate-50 text-slate-900'} ${isMad ? 'madness-active' : ''}`}>
                    <div className={`whiteout-overlay ${isWhiteout ? 'whiteout-active' : ''}`} />
                    
                    <header className="p-4 border-b border-slate-800 flex justify-between">
                        <span className="text-blue-500 font-black uppercase text-sm">Universal AI</span>
                    </header>

                    <div className="flex-1 overflow-y-auto p-4 space-y-6 pb-28">
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-4 rounded-2xl text-sm ${m.role === 'user' ? 'bg-blue-600' : 'bg-slate-900 border border-slate-800'}`}>
                                    {m.content}
                                </div>
                            </div>
                        ))}
                    </div>

                    <footer className="p-4 fixed bottom-0 w-full backdrop-blur-md">
                        <div className="flex gap-2 max-w-3xl mx-auto">
                            <input className="flex-1 p-4 rounded-xl bg-slate-900 border border-slate-800 text-white" value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && onChat()} />
                            <button onClick={onChat} className="bg-blue-600 px-6 rounded-xl font-black text-white">Send</button>
                        </div>
                    </footer>
                    
                    <div className="bottom-watermark">
                        <p className="text-blue-500 font-black uppercase tracking-[0.4em] text-[12px] opacity-80">Powered by Gemini & Groq</p>
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
