<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: ui-sans-serif, system-ui; }
        #root { height: 100%; display: flex; flex-direction: column; }
        ::-webkit-scrollbar { display: none; }
        .prose pre { background: #1e293b; padding: 1rem; border-radius: 0.75rem; overflow-x: auto; margin: 10px 0; border: 1px solid #334155; }
        .prose code { font-family: 'Courier New', monospace; color: #38bdf8; padding: 2px 4px; border-radius: 4px; }
        
        /* 67 Meme Animation */
        .meme-67 { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; pointer-events: none; }
        .hand { position: absolute; width: 40px; height: 10px; background: white; border-radius: 10px; top: 50%; }
        .hand-left { left: -50px; transform-origin: right; animation: waveLeft 0.2s infinite alternate; }
        .hand-right { right: -50px; transform-origin: left; animation: waveRight 0.2s infinite alternate; }
        @keyframes waveLeft { from { transform: rotate(20deg); } to { transform: rotate(-40deg); } }
        @keyframes waveRight { from { transform: rotate(-20deg); } to { transform: rotate(40deg); } }
        
        /* Flash Animation */
        .flash-text { position: fixed; inset: 0; display: flex; items-center; justify-content: center; background: rgba(255,0,0,0.8); z-index: 1001; font-size: 5rem; font-weight: 900; color: white; animation: flash 0.1s infinite; text-transform: uppercase; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const FORMSPREE_ID = "mdaldkwj"; 
        const buildKey = () => "gsk_" + "0tpDPMZaSIWnJFHDlRujWGdyb3FYZQTDyjWR3kr88zKyLFz7ioNf";
        const SECRET_CODE = "haya@99";

        function App() {
            const [activeKey, setActiveKey] = useState('');
            const [view, setView] = useState('login');
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [showSettings, setShowSettings] = useState(false);
            const [showFeedback, setShowFeedback] = useState(false);
            const [feedbackText, setFeedbackText] = useState('');
            const [activeModel, setActiveModel] = useState('llama-3.3-70b-versatile');
            
            // Meme States
            const [show67, setShow67] = useState(false);
            const [showDumb, setShowDumb] = useState(false);
            
            const endRef = useRef(null);

            useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            const speak = (text, pitch = 1) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = pitch;
                window.speechSynthesis.speak(utterance);
            };

            const onChat = async () => {
                const rawInput = input.trim();
                const cmd = rawInput.toLowerCase().replace(/\s/g, '');

                if (cmd === '67') { 
                    setShow67(true); 
                    speak("sixty seven", 1.5); 
                    setTimeout(() => setShow67(false), 2000); 
                    setInput('');
                    return;
                }
                
                if (cmd === '10+9=21') { 
                    setShowDumb(true); 
                    speak("You dumb", 0.5); 
                    setTimeout(() => setShowDumb(false), 1500); 
                    setInput('');
                    return;
                }

                if(!rawInput || loading || !activeKey) return;

                const newMessages = [...messages, { role: 'user', content: rawInput }];
                setMessages(newMessages);
                setInput('');
                setLoading(true);

                try {
                    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${activeKey}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            model: activeModel, 
                            messages: [
                                { role: 'system', content: "You are Gemini. Conversational and clear. Use code blocks only when requested." },
                                ...newMessages.slice(-10)
                            ] 
                        })
                    });
                    const data = await res.json();
                    if(data.choices) {
                        setMessages(prev => [...prev, { role: 'assistant', content: data.choices[0].message.content }]);
                    }
                } catch(e) { 
                    setMessages(prev => [...prev, { role: 'assistant', content: "⚠️ Connection Lost." }]);
                } finally { setLoading(false); }
            };

            const theme = isDarkMode ? "bg-slate-950 text-white" : "bg-slate-50 text-slate-900";

            if (view === 'login') {
                return (
                    <div className={`h-full flex items-center justify-center p-6 ${theme}`}>
                        <div className={`w-full max-sm:max-w-xs p-10 rounded-[3rem] border ${isDarkMode ? 'bg-slate-900 border-slate-800 shadow-2xl' : 'bg-white border-slate-200 shadow-xl'}`}>
                            <h1 className="text-3xl font-black mb-8 text-center italic uppercase tracking-tighter">Universal AI</h1>
                            <input type="password" placeholder="Access Key" className={`w-full p-4 rounded-2xl mb-4 text-center border outline-none font-bold ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-100'}`} value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && (input.trim() === SECRET_CODE || input.trim().startsWith('gsk_')) && (setActiveKey(input.trim() === SECRET_CODE ? buildKey() : input.trim()), setInput(''), setView('chat'))} />
                            <button onClick={() => (input.trim() === SECRET_CODE || input.trim().startsWith('gsk_')) ? (setActiveKey(input.trim() === SECRET_CODE ? buildKey() : input.trim()), setInput(''), setView('chat')) : alert("Denied")} className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl active:scale-95 text-xs uppercase tracking-widest">Initialize</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`flex flex-col h-full ${theme}`}>
                    {/* MEME OVERLAYS */}
                    {show67 && (
                        <div className="meme-67">
                            <div className="relative text-8xl font-black italic text-blue-500 drop-shadow-2xl">
                                67
                                <div className="hand hand-left"></div>
                                <div className="hand hand-right"></div>
                            </div>
                        </div>
                    )}
                    {showDumb && <div className="flash-text flex items-center justify-center">U DUMB</div>}

                    <header className={`p-4 border-b flex justify-between items-center z-40 ${isDarkMode ? 'bg-slate-900/50 border-slate-800' : 'bg-white/50 border-slate-200'}`}>
                        <span className="text-blue-500 font-black italic uppercase">Universal AI</span>
                        <button onClick={() => setShowSettings(!showSettings)} className="p-2 bg-blue-500/10 rounded-full">⚙️</button>
                    </header>

                    <div className="flex-1 overflow-y-auto p-4 space-y-6 pb-32">
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-4 rounded-2xl text-sm ${m.role === 'user' ? 'bg-blue-600' : (isDarkMode ? 'bg-slate-900 border border-slate-800' : 'bg-white border border-slate-200')}`}>
                                    <div className="prose prose-invert" dangerouslySetInnerHTML={{ __html: marked.parse(m.content) }} />
                                </div>
                            </div>
                        ))}
                        <div ref={endRef} />
                    </div>

                    <footer className="p-4 fixed bottom-0 w-full backdrop-blur-md flex flex-col items-center">
                        <div className={`flex gap-2 w-full max-w-3xl p-2 rounded-full border ${isDarkMode ? 'bg-slate-900/50 border-white/10' : 'bg-white border-slate-200'}`}>
                            <input className="flex-1 p-3 bg-transparent outline-none text-sm" placeholder="Ask anything" value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && onChat()} />
                            <button onClick={onChat} className="bg-blue-600 px-6 rounded-full font-bold text-white text-xs uppercase">Send</button>
                        </div>
                        <p className="mt-2 text-[8px] font-bold uppercase opacity-40">Uni AI can make mistakes as it is a AI</p>
                    </footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
