<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universal AI | Visual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: ui-sans-serif, system-ui; }
        #root { height: 100%; display: flex; flex-direction: column; }
        ::-webkit-scrollbar { display: none; }
        .ai-image { width: 100%; border-radius: 1.5rem; margin-top: 1rem; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const buildKey = () => {
            const a = "gsk_";
            const b = "0tpDPMZaSIWnJFHDlRujWGdyb3FYZQTDyjWR3kr88zKyLFz7ioNf";
            return a + b;
        };
        const SECRET_CODE = "haya@99";

        function App() {
            const [activeKey, setActiveKey] = useState('');
            const [view, setView] = useState('login');
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(true);
            const endRef = useRef(null);

            useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            const onChat = async () => {
                if(!input.trim() || loading || !activeKey) return;
                
                const userText = input.trim();
                setMessages(prev => [...prev, { role: 'user', content: userText }]);
                setInput('');
                setLoading(true);

                try {
                    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 
                            'Authorization': `Bearer ${activeKey}`,
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify({ 
                            model: 'llama-3.3-70b-versatile', 
                            messages: [...messages, { role: 'user', content: userText }].slice(-6)
                        })
                    });

                    const data = await res.json();
                    if(data.choices) {
                        const aiReply = data.choices[0].message.content;
                        // Use the AI's reply to seed the image for better relevance
                        const prompt = encodeURIComponent(aiReply.split(' ').slice(0, 10).join(' '));
                        const imgUrl = `https://pollinations.ai/p/${prompt}?width=1080&height=1080&nologo=true&seed=${Math.floor(Math.random()*9999)}`;
                        
                        setMessages(prev => [...prev, { 
                            role: 'assistant', 
                            content: aiReply,
                            image: imgUrl
                        }]);
                    } else { throw new Error(data.error?.message); }
                } catch(e) { 
                    setMessages(prev => [...prev, { role: 'assistant', content: `⚠️ Error: ${e.message}` }]);
                } finally { setLoading(false); }
            };

            const handleLogin = () => {
                if (input.trim() === SECRET_CODE) {
                    setActiveKey(buildKey());
                    setInput('');
                    setView('chat');
                } else if (input.trim().startsWith('gsk_')) {
                    setActiveKey(input.trim());
                    setInput('');
                    setView('chat');
                } else {
                    alert("Unauthorized");
                }
            };

            const logout = () => {
                setActiveKey('');
                setMessages([]);
                setView('login');
                setShowSettings(false);
            };

            const theme = isDarkMode ? "bg-slate-950 text-white" : "bg-slate-50 text-slate-900";

            if (view === 'login') {
                return (
                    <div className={`h-full flex items-center justify-center p-6 ${theme}`}>
                        <div className={`w-full max-w-sm p-10 rounded-[3rem] border ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-2xl'}`}>
                            <h1 className="text-3xl font-black mb-2 tracking-tighter text-center italic">UNIVERSAL AI</h1>
                            <p className="text-center text-[10px] uppercase tracking-[0.4em] mb-10 opacity-40">Visual Core V2</p>
                            <input type="password" placeholder="Enter Access Key" className={`w-full p-4 rounded-2xl mb-4 text-center border outline-none ${isDarkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-100 border-slate-200'}`} value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleLogin()} />
                            <button onClick={handleLogin} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl active:scale-95 transition-all uppercase tracking-widest text-xs">Initialize</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`flex flex-col h-full ${theme}`}>
                    <header className={`p-4 border-b flex justify-between items-center backdrop-blur-md z-50 ${isDarkMode ? 'bg-slate-900/50 border-slate-800' : 'bg-white/50 border-slate-200'}`}>
                        <span className="text-blue-500 font-black text-sm tracking-tighter uppercase italic">Universal AI</span>
                        <button onClick={() => setShowSettings(!showSettings)} className="p-2 bg-blue-500/10 rounded-full">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        </button>
                    </header>

                    {showSettings && (
                        <div className={`absolute top-16 right-4 w-56 border rounded-3xl shadow-2xl p-4 z-[100] fade-in ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-full text-left p-3 hover:bg-blue-500/10 rounded-xl text-xs font-bold uppercase transition-colors mb-2">🌓 Toggle Theme</button>
                            <button onClick={logout} className="w-full text-left p-3 hover:bg-red-500/10 rounded-xl text-xs font-bold uppercase text-red-500 transition-colors">🔒 Terminate Session</button>
                        </div>
                    )}

                    <div className="flex-1 overflow-y-auto p-4 space-y-8 pb-32">
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[90%] p-5 rounded-3xl text-sm leading-relaxed ${m.role === 'user' ? 'bg-blue-600 text-white shadow-lg' : (isDarkMode ? 'bg-slate-900 border border-slate-800 text-slate-100 shadow-md' : 'bg-white border border-slate-200 text-slate-900 shadow-sm')}`}>
                                    {m.content}
                                    {m.image && (
                                        <div className="mt-4">
                                            <img src={m.image} alt="AI" className="ai-image" />
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-blue-500 text-[10px] font-black animate-pulse uppercase tracking-[0.3em] ml-2">Rendering Response...</div>}
                        <div ref={endRef} />
                    </div>

                    <footer className="p-4 fixed bottom-0 w-full backdrop-blur-md">
                        <div className="flex gap-2 max-w-3xl mx-auto bg-slate-900/40 p-2 rounded-[2rem] border border-white/5 shadow-2xl">
                            <input className="flex-1 p-4 bg-transparent text-white outline-none text-sm placeholder:opacity-30" placeholder="Type a message..." value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && onChat()} />
                            <button onClick={onChat} className="bg-blue-600 px-8 rounded-[1.5rem] font-black text-white active:scale-95 transition-all text-xs uppercase">Send</button>
                        </div>
                    </footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
