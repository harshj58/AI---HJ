<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: ui-sans-serif, system-ui; }
        #root { height: 100%; display: flex; flex-direction: column; }
        .login-card { border-radius: 3rem; padding: 3rem; width: 100%; max-width: 420px; text-align: center; }
        input { outline: none !important; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function App() {
            const [apiKey, setApiKey] = useState('');
            const [view, setView] = useState('login');
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [activeModel, setActiveModel] = useState('llama-3.3-70b-versatile');
            const endRef = useRef(null);

            const MASTER_CODE = 'haya@99';
            // Validated Base64 Key
            const ENCODED_KEY = "Z3NrX2IzY056akJYTXVHSmVQSWZJeVdHZHliM0ZZWFhxUFk2YndoN25vMjg3VDZWVVV6UG5w";

            useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            const onChat = async () => {
                if(!input.trim() || loading || !apiKey) return;
                
                const userMsg = input.trim();
                const newMessages = [...messages, { role: 'user', content: userMsg }];
                setMessages(newMessages);
                setInput('');
                setLoading(true);

                try {
                    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 
                            'Authorization': `Bearer ${apiKey}`, // Uses the key currently in state
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify({ 
                            model: activeModel, 
                            messages: newMessages.slice(-10)
                        })
                    });

                    const data = await res.json();
                    if(data.choices && data.choices[0]) {
                        setMessages(prev => [...prev, { role: 'assistant', content: data.choices[0].message.content }]);
                    } else {
                        throw new Error(data.error?.message || "Check API Key Limits");
                    }
                } catch(e) { 
                    setMessages(prev => [...prev, { role: 'assistant', content: `⚠️ Connection Error: ${e.message}` }]);
                } finally { setLoading(false); }
            };

            const handleStart = () => {
                const typedValue = apiKey.trim();
                
                if (typedValue === MASTER_CODE) {
                    const decoded = atob(ENCODED_KEY);
                    setApiKey(decoded); // Update state to the real key
                    // We use a small timeout to ensure React finishes updating the state 
                    // before we switch the view and allow the user to chat.
                    setTimeout(() => setView('chat'), 100);
                } else if (typedValue.startsWith('gsk_')) {
                    setView('chat');
                } else {
                    alert("Invalid Access Code or API Key");
                }
            };

            const themeClass = isDarkMode ? "bg-slate-950 text-white" : "bg-slate-50 text-slate-900";
            const cardClass = isDarkMode ? "bg-slate-900 border-slate-800 shadow-2xl" : "bg-white border-slate-200 shadow-xl";

            if (view === 'login') {
                return (
                    <div className={`relative h-full flex items-center justify-center p-6 transition-colors duration-300 ${themeClass}`}>
                        <div className={`login-card border ${cardClass}`}>
                            <h1 className="text-4xl font-black mb-1 tracking-tighter uppercase">Universal AI</h1>
                            <p className="text-blue-500 text-[10px] font-bold uppercase tracking-[0.3em] mb-8">Intelligence Suite</p>
                            
                            <div className="mb-6">
                                <a href="https://console.groq.com/keys" target="_blank" className="block w-full py-3 rounded-xl bg-blue-600/10 border border-blue-600/30 text-blue-500 font-black uppercase text-[11px] tracking-widest">Get Groq API Key</a>
                            </div>

                            <input 
                                type="password" 
                                placeholder="Key or Master Code" 
                                className={`w-full p-4 rounded-2xl mb-4 text-center text-sm font-bold border ${isDarkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-100 border-slate-300 text-slate-900'}`} 
                                value={apiKey} 
                                onChange={(e) => setApiKey(e.target.value)} 
                                onKeyPress={(e) => e.key === 'Enter' && handleStart()}
                            />
                            <button onClick={handleStart} className="w-full bg-blue-600 text-white font-black uppercase py-4 rounded-2xl shadow-xl active:scale-95 transition-all">START SYSTEM</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`flex flex-col h-full transition-colors duration-300 ${themeClass}`}>
                    <header className={`p-4 border-b flex justify-between items-center z-50 backdrop-blur-md ${isDarkMode ? 'bg-slate-900/50 border-slate-800' : 'bg-white/50 border-slate-200'}`}>
                        <span className="text-blue-500 font-black uppercase tracking-tighter text-sm">Universal AI</span>
                        <button onClick={() => setShowSettings(!showSettings)} className="text-blue-500 text-xs font-bold uppercase">Settings</button>
                    </header>

                    {showSettings && (
                        <div className={`absolute top-16 right-4 w-64 border rounded-[2rem] shadow-2xl p-6 z-[100] backdrop-blur-xl ${isDarkMode ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-slate-200'}`}>
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-full bg-blue-600 text-white p-3 rounded-xl text-[10px] font-black uppercase mb-3">Toggle Theme</button>
                            <button onClick={() => {setView('login'); setApiKey(''); setMessages([]); setShowSettings(false)}} className="w-full text-red-500 text-[10px] font-black uppercase text-center py-2">Log Out</button>
                        </div>
                    )}

                    <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-32">
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-4 rounded-2xl text-sm shadow-sm ${m.role === 'user' ? 'bg-blue-600 text-white' : (isDarkMode ? 'bg-slate-900 border border-slate-800 text-slate-100' : 'bg-white border border-slate-200 text-slate-900')}`}>
                                    {m.content}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-blue-500 text-[10px] font-black animate-pulse uppercase px-2">System Processing...</div>}
                        <div ref={endRef} />
                    </div>

                    <footer className={`p-4 border-t pb-10 fixed bottom-0 w-full backdrop-blur-md ${isDarkMode ? 'bg-slate-950/80 border-slate-800' : 'bg-slate-50/80 border-slate-200'}`}>
                        <div className="flex gap-2 max-w-3xl mx-auto">
                            <input className={`flex-1 p-4 rounded-xl border text-sm transition-all ${isDarkMode ? 'bg-slate-900 border-slate-800 text-white focus:border-blue-500' : 'bg-white border-slate-300 focus:border-blue-500'}`} placeholder="Ask me anything..." value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && onChat()} />
                            <button onClick={onChat} className="bg-blue-600 px-6 rounded-xl font-black uppercase text-[10px] text-white active:scale-95 transition-all">Send</button>
                        </div>
                    </footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
