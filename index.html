<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { transition: background 0.4s; overflow: hidden; font-family: ui-sans-serif, system-ui; }
        .dark { background: #02040a; color: white; }
        .light { background: #f0f2f5; color: #1a1a1a; }
        .auth-card { background: #0d1117; border-radius: 2.5rem; border: 1px solid rgba(255,255,255,0.05); shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .glass { backdrop-filter: blur(20px); background: rgba(13, 17, 23, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem; }
        .light .glass { background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(0,0,0,0.1); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes shake { 0%, 100% {transform: translate(0,0);} 25% {transform: translate(2px,2px);} 75% {transform: translate(-2px,-2px);} }
        .vibrate { animation: shake 0.1s infinite; }
    </style>
</head>
<body class="dark">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [view, setView] = useState('auth');
            const [isDark, setIsDark] = useState(true);
            const [model, setModel] = useState('fast'); 
            const [key, setKey] = useState('');
            const [input, setInput] = useState('');
            const [msgs, setMsgs] = useState([]);
            const [loading, setLoading] = useState(false);
            const [vib, setVib] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => {
                document.body.className = isDark ? 'dark' : 'light';
            }, [isDark]);

            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [msgs]);

            const handleAuth = (val) => {
                const secretCode = 'haya@99';
                if (val === secretCode) {
                    const _enc = "Z3NrX1NBdDh6eXZoQUl5eEZIdmVYNmFIV0dyeWIzRllDRnNPWVNGR0NWN0o3TTdDbTNlWTB3Sk0=";
                    setKey(window.atob(_enc));
                    setView('chat');
                } else if (val.startsWith('gsk_')) {
                    setKey(val);
                    setView('chat');
                } else {
                    alert("Access Denied");
                }
            };

            const callAI = async () => {
                if(!input.trim() || loading) return;
                const m = input; setInput('');
                
                if(m === '67') { setVib(true); window.speechSynthesis.speak(new SpeechSynthesisUtterance("6 7")); setTimeout(()=>setVib(false), 800); }
                if(m === '10+9=21') { setVib(true); const s=new SpeechSynthesisUtterance("You dumb"); s.pitch=0.5; window.speechSynthesis.speak(s); setTimeout(()=>setVib(false), 1000); }

                setMsgs(p => [...p, {role: 'user', content: m}]);
                setLoading(true);

                try {
                    const modelId = model === 'fast' ? "llama3-8b-8192" : "llama-3.3-70b-versatile";
                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            model: modelId, 
                            messages: [
                                {role: "system", content: `You are Universal AI (${model} mode). Plain text only. No asterisks. No markdown.`},
                                ...msgs.slice(-4),
                                {role: 'user', content: m}
                            ]
                        })
                    });
                    const data = await response.json();
                    let reply = data.choices[0].message.content.replace(/\*/g, '');
                    setMsgs(p => [...p, {role: 'assistant', content: reply}]);
                } catch (e) {
                    setMsgs(p => [...p, {role: 'assistant', content: "System Offline."}]);
                }
                setLoading(false);
            };

            if (view === 'auth') return (
                <div className="h-screen flex flex-col items-center justify-center p-6 bg-[#02040a]">
                    <div className="auth-card p-12 w-full max-w-[400px] text-center">
                        <h1 className="text-3xl font-black text-white mb-1 uppercase tracking-tighter">Universal AI</h1>
                        <p className="text-[10px] font-bold text-blue-500 tracking-[0.3em] mb-10 opacity-80 uppercase">Intelligence Suite</p>
                        
                        <a href="https://console.groq.com/keys" target="_blank" className="block w-full py-4 mb-4 rounded-xl bg-[#161b22] text-[#3b82f6] text-xs font-bold uppercase tracking-widest border border-white/5 hover:bg-[#1c2128] transition-all">
                            Get Groq API Key
                        </a>
                        
                        <input 
                            type="text" 
                            placeholder="Enter API Key" 
                            className="w-full p-4 bg-[#161b22] rounded-xl mb-4 text-center text-white text-xs border border-white/5 outline-none focus:border-blue-500 transition-all"
                            onKeyPress={e => e.key === 'Enter' && handleAuth(e.target.value)}
                        />
                        
                        <button onClick={() => handleAuth(document.querySelector('input').value)} className="w-full bg-[#2563eb] text-white py-4 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg shadow-blue-900/20 active:scale-95 transition-all">
                            Start System
                        </button>
                    </div>
                    <div className="mt-20 text-[10px] font-bold tracking-[0.4em] text-gray-600 uppercase">Powered by Gemini & Groq</div>
                </div>
            );

            return (
                <div className={`h-screen flex flex-col p-4 ${vib ? 'vibrate' : ''}`}>
                    <header className="glass p-4 mb-4 flex justify-between items-center">
                        <div className="flex flex-col">
                            <h1 className="text-sm font-black uppercase tracking-widest text-blue-500">Universal AI</h1>
                            <div className="flex gap-4 mt-2">
                                <button onClick={()=>setModel('fast')} className={`text-[10px] font-black uppercase tracking-widest ${model==='fast'?'text-white':'text-gray-500'}`}>Llama(Fast)</button>
                                <button onClick={()=>setModel('expert')} className={`text-[10px] font-black uppercase tracking-widest ${model==='expert'?'text-white':'text-gray-500'}`}>Llama(Expert)</button>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={()=>setIsDark(!isDark)} className="w-10 h-10 rounded-xl glass flex items-center justify-center border-none">{isDark?'☀️':'🌙'}</button>
                            <button onClick={()=>setView('auth')} className="px-4 h-10 rounded-xl glass flex items-center justify-center text-[9px] font-black uppercase text-red-500 border-none">Logout</button>
                        </div>
                    </header>

                    <div className="flex-1 glass overflow-hidden flex flex-col shadow-2xl">
                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-6 space-y-6 scrollbar-hide">
                            {msgs.map((m, i) => (
                                <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`p-4 rounded-[1.2rem] max-w-[85%] text-sm leading-relaxed ${
                                        m.role === 'user' ? 'bg-blue-600 text-white font-medium' : 'bg-gray-500/10'
                                    }`}>
                                        {m.content}
                                    </div>
                                </div>
                            ))}
                            {loading && <div className="text-blue-500 font-black text-[9px] animate-pulse uppercase tracking-widest">Processing...</div>}
                        </div>

                        <div className="p-4 border-t border-white/5 flex gap-2">
                            <input 
                                className="flex-1 p-4 bg-transparent outline-none text-sm placeholder:opacity-50"
                                placeholder={`Consult ${model === 'fast' ? 'Fast' : 'Expert'} System...`}
                                value={input}
                                onChange={e => setInput(e.target.value)}
                                onKeyPress={e => e.key === 'Enter' && callAI()}
                            />
                            <button onClick={callAI} className="bg-blue-600 text-white px-8 rounded-xl font-black text-[10px] uppercase tracking-widest active:scale-95">Send</button>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
